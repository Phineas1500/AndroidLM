pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // requery's sqlite-android (SQLite with FTS5 for the retrieval corpus) is published on
        // JitPack only. Nothing else may resolve from there.
        maven {
            url 'https://jitpack.io'
            content { includeModule 'com.github.requery', 'sqlite-android' }
        }
    }
}

rootProject.name = "AndroidLM"
include(":app")
include(":research")
