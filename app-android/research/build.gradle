// Pure-JVM port of scripts/rag.py's retrieval pipeline (no Android dependencies): it runs the
// same in JVM unit tests and inside the app. Storage is behind the SqlDatabase and
// ZstdDecompressor interfaces; the JVM implementations live in the test source set only.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    // src/testFixtures holds the golden comparisons (GoldenChecks), shared by this module's
    // GoldenTest and the app's on-device DeviceGoldenTest.
    id 'java-test-fixtures'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testFixturesApi 'junit:junit:4.13.2'
    testFixturesApi 'com.google.code.gson:gson:2.11.0'
    // SQLite with FTS5 and zstd for the golden tests (the app will bring its own implementations)
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    testImplementation 'com.github.luben:zstd-jni:1.5.6-6'
    testRuntimeOnly 'org.slf4j:slf4j-nop:1.7.36'
}

test {
    useJUnit()
    maxHeapSize = '512m'
    // golden fixtures: -DANDROIDLM_FIXTURES=... or env ANDROIDLM_FIXTURES, else ~/androidlm-tools/fixtures
    def fixtures = System.getProperty('ANDROIDLM_FIXTURES') ?: System.getenv('ANDROIDLM_FIXTURES')
    if (fixtures) systemProperty 'ANDROIDLM_FIXTURES', fixtures
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}
